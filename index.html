function applyTemplateToBook(b,templateId,keepUserContent=false){
 const t=templateMeta(templateId); if(!b)return;
 b.templateId=templateId; b.templateName=t.name; b.templateEditable=true;
 const d=templateElements(b,templateId);
 if(!keepUserContent){
   b.pages[0].elements=d.cover;
   const bodyPages=b.pages.filter(p=>p.type==='body');
   if(bodyPages[0]) bodyPages[0].elements=d.body;
   for(let i=1;i<bodyPages.length;i++) bodyPages[i].elements=[];
   const back=b.pages.find(p=>p.type==='back'); if(back) back.elements=d.back;
 }
 b.updated=Date.now(); persist();
}

function loadState(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');return x&&Array.isArray(x.books)?x:{books:[]}}catch{return {books:[]}}}

function persist(){try{localStorage.setItem(STORE,JSON.stringify(state));return true}catch(e){alert('Penyimpanan perangkat penuh. Coba hapus beberapa buku atau ekspor project.');return false}}
function uid(prefix='id'){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function safeName(v){return (String(v||'digital-book').replace(/[^a-z0-9\- _]/gi,'').trim().replace(/\s+/g,'-')||'digital-book').slice(0,70)}
function getBook(){return state.books.find(b=>b.id===currentId)||null}

  else if(isEmoji) body=`<span class="object-content">${esc(o.text)}</span>`;

  return `<div class="design-object ${isText?'text-object':isEmoji?'emoji-object':''}" data-id="${esc(o.id)}" aria-label="${esc(isText?safeText:o.kind)}" style="${style}${extra}display:${o.visible===false?'none':'block'};">${body}${selectedId===o.id?selectionHandles():''}</div>`;
}
function selectionHandles(){return `<div class="selection"><i class="handle tl" data-handle="tl"></i><i class="handle tm" data-handle="tm"></i><i class="handle tr" data-handle="tr"></i><i class="handle ml" data-handle="ml"></i><i class="handle mr" data-handle="mr"></i><i class="handle bl" data-handle="bl"></i><i class="handle bm" data-handle="bm"></i><i class="handle br" data-handle="br"></i><i class="rotate-stem"></i><i class="handle rot" data-handle="rot"></i></div>`}
let lastTap={id:null,time:0,x:0,y:0};
function bindObjects(){
  document.querySelectorAll('#bookStage .design-object').forEach(el=>{el.addEventListener('pointerdown',startPointer);});
  const stage=document.getElementById('bookStage');

function startPointer(e){
  e.stopPropagation();
  const id=this.dataset.id,o=getObject(id); if(!o)return;
  const now=Date.now(), same=lastTap.id===id && now-lastTap.time<360 && Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<24;
  lastTap={id,time:now,x:e.clientX,y:e.clientY};
  const wasSelected=selectedId===id;
  selectedId=id;
  if(same){
    if(o.kind==='text') openTextEditorSheet(); else openPropertySheet();
    return;
  }
  if(!wasSelected){renderEditor();return;}
  if(o.locked)return;
  const handle=e.target.dataset?.handle;
  const r=document.getElementById('bookStage').getBoundingClientRect();
  drag={id,startX:e.clientX,startY:e.clientY,x:o.x,y:o.y,w:o.w,h:o.h,rotate:o.rotate||0,fontSize:o.size||24,mode:handle?handle:'move',rect:r};
  document.addEventListener('pointermove',movePointer,{passive:false});
  document.addEventListener('pointerup',endPointer,{once:true});
}
function updateDraggedDom(o){
  const el=document.querySelector(`#bookStage .design-object[data-id="${CSS.escape(o.id)}"]`); if(!el)return;
  el.style.left=o.x+'%';el.style.top=o.y+'%';el.style.width=o.w+'%';el.style.height=o.h+'%';el.style.transform=`rotate(${o.rotate||0}deg)`;
  if(o.kind==='text'){el.style.fontSize=(o.size||24)+'px';const c=el.querySelector('.object-content');if(c)c.textContent=o.text||'';}
}
function resizeTextByScale(o,oldW,oldH,newW,newH,mode){
  if(o.kind!=='text')return;
  let ratio=1;
  if(mode==='mr'||mode==='ml') ratio=newW/oldW;
  else if(mode==='tm'||mode==='bm') ratio=newH/oldH;
  else ratio=Math.max(newW/oldW,newH/oldH);
  o.size=clamp((drag.fontSize||24)*ratio,8,180);
}
function movePointer(e){
  if(!drag)return; e.preventDefault();
  const o=getObject(drag.id),r=drag.rect; if(!o)return;
  const dx=(e.clientX-drag.startX)/r.width*100,dy=(e.clientY-drag.startY)/r.height*100;
  const oldW=drag.w,oldH=drag.h;
  if(drag.mode==='move'){o.x=clamp(drag.x+dx,0,100-o.w);o.y=clamp(drag.y+dy,0,100-o.h)}
  else if(drag.mode==='br'){o.w=clamp(drag.w+dx,5,100-o.x);o.h=clamp(drag.h+dy,5,100-o.y);resizeTextByScale(o,oldW,oldH,o.w,o.h,'br')}
  else if(drag.mode==='tr'){o.w=clamp(drag.w+dx,5,100-o.x);o.y=clamp(drag.y+dy,0,drag.y+drag.h-5);o.h=clamp(drag.h-dy,5,100-o.y);resizeTextByScale(o,oldW,oldH,o.w,o.h,'tr')}
  else if(drag.mode==='bl'){o.x=clamp(drag.x+dx,0,drag.x+drag.w-5);o.w=clamp(drag.w-dx,5,100-o.x);o.h=clamp(drag.h+dy,5,100-o.y);resizeTextByScale(o,oldW,oldH,o.w,o.h,'bl')}
  else if(drag.mode==='tl'){o.x=clamp(drag.x+dx,0,drag.x+drag.w-5);o.y=clamp(drag.y+dy,0,drag.y+drag.h-5);o.w=clamp(drag.w-dx,5,100-o.x);o.h=clamp(drag.h-dy,5,100-o.y);resizeTextByScale(o,oldW,oldH,o.w,o.h,'tl')}
  else if(drag.mode==='mr'){o.w=clamp(drag.w+dx,5,100-o.x);resizeTextByScale(o,oldW,oldH,o.w,o.h,'mr')}
  else if(drag.mode==='ml'){o.x=clamp(drag.x+dx,0,drag.x+drag.w-5);o.w=clamp(drag.w-dx,5,100-o.x);resizeTextByScale(o,oldW,oldH,o.w,o.h,'ml')}
  else if(drag.mode==='bm'){o.h=clamp(drag.h+dy,5,100-o.y);resizeTextByScale(o,oldW,oldH,o.w,o.h,'bm')}
  else if(drag.mode==='tm'){o.y=clamp(drag.y+dy,0,drag.y+drag.h-5);o.h=clamp(drag.h-dy,5,100-o.y);resizeTextByScale(o,oldW,oldH,o.w,o.h,'tm')}
  else if(drag.mode==='rot'){const cx=r.left+(o.x+o.w/2)/100*r.width,cy=r.top+(o.y+o.h/2)/100*r.height;o.rotate=Math.round((Math.atan2(e.clientY-cy,e.clientX-cx)*180/Math.PI+90)/2)*2}
  updateDraggedDom(o);
}

function endPointer(){
  if(drag){commitHistory();const b=getBook();b.updated=Date.now();persist();renderEditor()}
  document.removeEventListener('pointermove',movePointer);drag=null;
}

function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function getObject(id){return getBook()?.pages[currentPage]?.elements.find(o=>o.id===id)}
function selectObject(id,rerender=true){selectedId=id;if(rerender)renderEditor()}
function renderObjectPanel(){const p=document.getElementById('propertyPanel'),a=document.getElementById('objectActions'),o=getObject(selectedId);if(!o){p.innerHTML=`<div class="prop-tabs"><button class="prop-tab active">Properti</button><button class="prop-tab" onclick="animationScreen()">Animasi</button><button class="prop-tab" onclick="openEffectModal()">Efek</button></div><div class="empty">Pilih objek di canvas untuk mengeditnya.</div>`;a.innerHTML='<button onclick="addText()">＋ Teks</button><button onclick="addPhoto()">＋ Foto</button><button onclick="addEmoji()">＋ Stiker</button>';return}p.innerHTML=`<div class="prop-tabs"><button class="prop-tab active">Properti</button><button class="prop-tab" onclick="animationScreen()">Animasi</button><button class="prop-tab" onclick="openEffectModal()">Efek</button></div><div class="prop-section"><div class="prop-title">${o.kind==='image'?'Foto':o.kind==='text'?'Teks':o.kind==='shape'?'Shape':'Stiker'}</div><div class="prop-grid"><button class="mini-btn" onclick="nudge(-1,0)">←</button><button class="mini-btn" onclick="nudge(0,-1)">↑</button><button class="mini-btn" onclick="nudge(0,1)">↓</button><button class="mini-btn" onclick="nudge(1,0)">→</button></div></div><div class="prop-section"><div class="prop-title">Posisi & Ukuran</div><div class="prop-grid"><label>X<input class="prop-field" type="number" value="${(+o.x).toFixed(1)}" onchange="setObj('x',this.value)"></label><label>Y<input class="prop-field" type="number" value="${(+o.y).toFixed(1)}" onchange="setObj('y',this.value)"></label><label>Lebar<input class="prop-field" type="number" value="${(+o.w).toFixed(1)}" onchange="setObj('w',this.value)"></label><label>Tinggi<input class="prop-field" type="number" value="${(+o.h).toFixed(1)}" onchange="setObj('h',this.value)"></label></div></div><div class="prop-section"><div class="prop-title">Rotasi</div><div class="prop-row"><button class="mini-btn" onclick="rotateObject(-15)">−15°</button><input class="prop-field" type="number" value="${Math.round(o.rotate||0)}" onchange="setObj('rotate',this.value)"><button class="mini-btn" onclick="rotateObject(15)">+15°</button><button class="mini-btn" onclick="rotateObject(90)">90°</button></div></div><div class="prop-section"><div class="prop-title">Opacity</div><input class="range" type="range" min="0" max="1" step=".01" value="${o.opacity??1}" onfocus="beginLive()" oninput="setObjLive('opacity',this.value)" onchange="commitLive()"></div>${o.kind==='text'?`<div class="prop-section"><div class="prop-title">Teks</div><textarea id="liveText" class="prop-field" rows="3" onfocus="beginLive()" oninput="setObjLive('text',this.value)" onchange="commitLive()">${esc(o.text)}</textarea><label class="font-label">Font<select class="font-select" onchange="setObj('font',this.value)"><option value="Georgia" ${o.font==='Georgia'?'selected':''}>Georgia</option><option value="Arial" ${o.font==='Arial'?'selected':''}>Arial</option><option value="Times New Roman" ${o.font==='Times New Roman'?'selected':''}>Times New Roman</option><option value="Courier New" ${o.font==='Courier New'?'selected':''}>Courier New</option><option value="Trebuchet MS" ${o.font==='Trebuchet MS'?'selected':''}>Trebuchet MS</option><option value="Verdana" ${o.font==='Verdana'?'selected':''}>Verdana</option><option value="system-ui" ${o.font==='system-ui'?'selected':''}>Modern</option></select></label><div class="prop-row size-controls" style="margin-top:7px"><button class="mini-btn" onclick="changeTextSize(-2)">A−</button><input class="range" type="range" min="8" max="180" step="1" value="${o.size||24}" oninput="setObjLive('size',this.value)" onchange="commitLive()"><button class="mini-btn" onclick="changeTextSize(2)">A+</button></div><div class="prop-row"><input class="prop-field" type="number" min="8" max="180" value="${o.size||24}" onchange="setObj('size',this.value)"><input class="colorbox" type="color" value="${o.color||'#30293d'}" onchange="setObj('color',this.value)"><button class="mini-btn ${o.bold?'active':''}" onclick="setObj('bold',!${!!o.bold})">B</button><button class="mini-btn ${o.italic?'active':''}" onclick="setObj('italic',!${!!o.italic})">I</button></div><div class="prop-row" style="margin-top:7px"><button class="mini-btn" onclick="setObj('align','left')">Kiri</button><button class="mini-btn" onclick="setObj('align','center')">Tengah</button><button class="mini-btn" onclick="setObj('align','right')">Kanan</button><button class="mini-btn" onclick="toggleShadow()">Shadow</button></div></div>`:''}${o.kind==='image'?`<div class="prop-section"><div class="prop-title">Foto</div><div class="prop-row"><button class="mini-btn" onclick="replacePhoto()">Ganti</button><button class="mini-btn" onclick="fitImage()">Isi</button><button class="mini-btn" onclick="toggleImageBorder()">Border</button><button class="mini-btn" onclick="toggleShadow()">Shadow</button></div><div class="prop-row" style="margin-top:7px"><button class="mini-btn" onclick="setImageFilter('none')">Normal</button><button class="mini-btn" onclick="setImageFilter('grayscale(1)')">B&W</button><button class="mini-btn" onclick="setImageFilter('sepia(.75)')">Vintage</button><button class="mini-btn" onclick="setImageFilter('brightness(1.15) saturate(1.2)')">Bright</button></div></div>`:''}${o.kind==='shape'?`<div class="prop-section"><div class="prop-title">Shape</div><div class="prop-row"><input class="colorbox" type="color" value="${o.fill||'#8b7cf6'}" onchange="setObj('fill',this.value)"><input class="prop-field" type="number" value="${o.radius||18}" onchange="setObj('radius',this.value)"></div></div>`:''}<div class="prop-section"><div class="prop-title">Layer & Objek</div><div class="prop-row"><button class="mini-btn" onclick="layer(1)">⬆ Front</button><button class="mini-btn" onclick="layer(-1)">⬇ Back</button><button class="mini-btn" onclick="duplicateObject()">⧉ Duplikat</button><button class="mini-btn" onclick="toggleLock()">${o.locked?'🔓 Buka':'🔒 Kunci'}</button><button class="mini-btn" style="color:#b53c5b" onclick="deleteObject()">🗑 Hapus</button></div></div>`;a.innerHTML=`${o.kind==='text'?'<button onclick="openTextEditorSheet()">Teks</button>':''}<button onclick="openPropertySheet()">⚙ Properti</button><button onclick="duplicateObject()">⧉ Salin</button><button onclick="openLayerModal()">▱ Layer</button><button onclick="rotateObject(-15)">↶</button><button onclick="rotateObject(15)">↷</button><button onclick="toggleLock()">${o.locked?'🔓':'🔒'}</button><button onclick="deleteObject()">🗑 Hapus</button>`}
function openPropertySheet(){const p=document.getElementById('propertyPanel');if(!p)return;renderObjectPanel();p.classList.toggle('open');}
function replacePhoto(){const o=getObject(selectedId);if(!o||o.kind!=='image')return;const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(!i.files[0])return;commitHistory();o.src=await readFile(i.files[0]);persist();renderEditor()};i.click()}
function fitImage(){const o=getObject(selectedId);if(!o)return;commitHistory();o.x=5;o.y=5;o.w=90;o.h=90;persist();renderEditor()}
function toggleImageBorder(){const o=getObject(selectedId);if(!o)return;commitHistory();o.border=o.border?0:3;persist();renderEditor()}
function saveAndDownload(id){const b=state.books.find(x=>x.id===id);if(!b)return;b.updated=Date.now();persist();downloadProject(id)}
function setObj(k,v){const o=getObject(selectedId);if(!o)return;commitHistory();if(k==='text'||k==='color'||k==='bold'||k==='italic'||k==='align'||k==='font'||k==='stroke')o[k]=v;else o[k]=+v;if(k==='size')o.size=clamp(o.size,8,180);if(k==='x')o.x=clamp(o.x,0,100-o.w);if(k==='y')o.y=clamp(o.y,0,100-o.h);if(k==='w')o.w=clamp(o.w,5,100-o.x);if(k==='h')o.h=clamp(o.h,5,100-o.y);getBook().updated=Date.now();persist();renderEditor()}
function beginLive(){if(!liveSnapshot){const b=getBook();if(b)liveSnapshot=JSON.stringify(b)}}
function setObjLive(k,v){const o=getObject(selectedId);if(!o)return;beginLive();o[k]=(k==='text'||k==='color'||k==='bold'||k==='italic'||k==='align'||k==='font')?v:+v;getBook().updated=Date.now();persist();updateSelectedDom()}
function commitLive(){if(liveSnapshot){undoStack.push(liveSnapshot);if(undoStack.length>30)undoStack.shift();redoStack=[];liveSnapshot=null;persist()}}
function updateSelectedDom(){const o=getObject(selectedId),el=o&&document.querySelector(`#bookStage .design-object[data-id="${CSS.escape(o.id)}"]`);if(!o||!el)return;el.style.left=o.x+'%';el.style.top=o.y+'%';el.style.width=o.w+'%';el.style.height=o.h+'%';el.style.opacity=o.opacity??1;el.style.transform=`rotate(${o.rotate||0}deg)`;if(o.kind==='text'){el.style.fontSize=clamp(+o.size||24,8,180)+'px';el.style.color=o.color||'#30293d';el.style.fontWeight=o.bold?'800':'500';el.style.fontStyle=o.italic?'italic':'normal';el.style.fontFamily=`'${o.font||'Georgia'}',Georgia,serif`;el.style.textAlign=o.align||'left';el.style.textShadow=o.shadow?'2px 3px 7px #0004':'none';el.style.webkitTextStroke=o.stroke||'0px transparent';el.style.lineHeight='1.15';const c=el.querySelector('.object-content');if(c)c.textContent=String(o.text??'').trim()||'Teks baru';}}
function quickEditObject(e){e.stopPropagation();const o=getObject(this.dataset.id);if(!o)return;selectedId=o.id;if(o.kind==='text')openTextEditorSheet();else openPropertySheet()}
function openTextEditorSheet(){
 const o=getObject(selectedId); if(!o||o.kind!=='text')return;
 const modal=document.getElementById('modal'); modal.className='';
 const fonts=['Georgia','Arial','Times New Roman','Courier New','Trebuchet MS','Verdana','system-ui'];
 modal.innerHTML=`<div class="text-inline-editor"><div class="text-inline-card"><div class="text-inline-head"><h3>Edit Teks</h3><button class="backbtn" onclick="closeModal()">×</button></div><textarea id="pixelText" class="text-editor-area" autofocus>${esc(o.text||'')}</textarea><label class="pixel-label">Font</label><select id="pixelFont" class="font-select">${fonts.map(f=>`<option value="${f}" ${o.font===f?'selected':''}>${f==='system-ui'?'Modern':f}</option>`).join('')}</select><label class="pixel-label">Ukuran <span id="pixelSizeLabel">${Math.round(o.size||24)} px</span></label><div class="prop-row"><input id="pixelSize" class="pixel-slider" type="range" min="8" max="180" value="${o.size||24}"><input id="pixelSizeNum" class="pixel-number" type="number" min="8" max="180" value="${o.size||24}"></div><div class="text-format-row"><button id="pxBold" class="${o.bold?'active':''}"><b>B</b></button><button id="pxItalic" class="${o.italic?'active':''}"><i>I</i></button><button id="pxLeft" class="${o.align==='left'?'active':''}">Kiri</button><button id="pxCenter" class="${o.align==='center'?'active':''}">Tengah</button><button id="pxRight" class="${o.align==='right'?'active':''}">Kanan</button><label class="mini-btn">Warna <input id="pixelColor" type="color" value="${o.color||'#30293d'}" style="vertical-align:middle"></label></div><div class="prop-row"><button class="mini-btn" onclick="setTextStroke('1px #000')">Stroke</button><button class="mini-btn" onclick="toggleShadow()">Shadow</button><button class="mini-btn" onclick="setTextStroke('0px transparent')">No Stroke</button></div><button class="primary full" onclick="saveTextEditor()">Selesai</button></div></div>`;
 const text=document.getElementById('pixelText'),font=document.getElementById('pixelFont'),size=document.getElementById('pixelSize'),num=document.getElementById('pixelSizeNum'),label=document.getElementById('pixelSizeLabel'),color=document.getElementById('pixelColor');
 beginLive();
 const live=()=>{const o=getObject(selectedId);if(!o)return;o.text=text.value;o.font=font.value;o.size=clamp(+size.value,8,180);num.value=o.size;label.textContent=o.size+' px';o.color=color.value;updateSelectedDom()};
 text.addEventListener('input',live);font.addEventListener('change',live);size.addEventListener('input',live);num.addEventListener('input',()=>{size.value=clamp(+num.value||24,8,180);live()});color.addEventListener('input',live);
 document.getElementById('pxBold').onclick=()=>{o.bold=!o.bold;live();document.getElementById('pxBold').classList.toggle('active',o.bold)};
 document.getElementById('pxItalic').onclick=()=>{o.italic=!o.italic;live();document.getElementById('pxItalic').classList.toggle('active',o.italic)};
 ['Left','Center','Right'].forEach(a=>document.getElementById('px'+a).onclick=()=>{o.align=a.toLowerCase();live();['Left','Center','Right'].forEach(x=>document.getElementById('px'+x).classList.toggle('active',o.align===x.toLowerCase()))});
}
function saveTextEditor(){commitLive();persist();closeModal();renderEditor();openPropertySheet()}
function setImageFilter(v){const o=getObject(selectedId);if(!o||o.kind!=='image')return;commitHistory();o.filter=v;persist();renderEditor()}

function changeTextSize(delta){const o=getObject(selectedId);if(!o||o.kind!=='text')return;commitHistory();o.size=clamp((+o.size||24)+delta,8,180);o.h=Math.max(o.h,Math.min(60,Math.max(8,o.size/2.2)));persist();renderEditor()}
function setTextStroke(v){const o=getObject(selectedId);if(!o||o.kind!=='text')return;commitHistory();o.stroke=v;persist();renderEditor()}
function setTextShadow(v){const o=getObject(selectedId);if(!o||o.kind!=='text')return;commitHistory();o.shadow=!!v;persist();renderEditor()}
function nudge(x,y){const o=getObject(selectedId);if(!o)return;commitHistory();o.x=clamp(o.x+x,0,100-o.w);o.y=clamp(o.y+y,0,100-o.h);persist();renderEditor()}
function rotateObject(n){const o=getObject(selectedId);if(!o)return;commitHistory();o.rotate=(o.rotate||0)+n;persist();renderEditor()}
function layer(dir){const p=getBook().pages[currentPage],i=p.elements.findIndex(o=>o.id===selectedId),j=i+dir;if(i<0||j<0||j>=p.elements.length)return;commitHistory();[p.elements[i],p.elements[j]]=[p.elements[j],p.elements[i]];persist();renderEditor()}
function duplicateObject(){const o=getObject(selectedId);if(!o)return;commitHistory();const n=JSON.parse(JSON.stringify(o));n.id=uid('o');n.x=clamp(n.x+4,0,100-n.w);n.y=clamp(n.y+4,0,100-n.h);getBook().pages[currentPage].elements.push(n);selectedId=n.id;persist();renderEditor()}
function deleteObject(){const p=getBook().pages[currentPage],i=p.elements.findIndex(o=>o.id===selectedId);if(i<0)return;commitHistory();p.elements.splice(i,1);selectedId=null;persist();renderEditor()}
function toggleLock(){const o=getObject(selectedId);if(!o)return;commitHistory();o.locked=!o.locked;persist();renderEditor()}
function selectAll(){const p=getBook().pages[currentPage];selectedId=p.elements[0]?.id||null;renderEditor()}
function layerMove(mode){
 const b=getBook(),p=b?.pages[currentPage],i=p?.elements.findIndex(o=>o.id===selectedId);if(!p||i<0)return;
 let j=i;
 if(mode==='up')j=Math.min(p.elements.length-1,i+1);
 if(mode==='down')j=Math.max(0,i-1);
 if(mode==='top')j=p.elements.length-1;
 if(mode==='bottom')j=0;
 if(j===i)return;
 commitHistory();const [o]=p.elements.splice(i,1);p.elements.splice(j,0,o);b.updated=Date.now();persist();renderEditor();openLayerModal();
}
function toggleObjectVisibility(id){const o=getBook()?.pages[currentPage]?.elements.find(x=>x.id===id);if(!o)return;commitHistory();o.visible=o.visible===false;getBook().updated=Date.now();persist();renderEditor();openLayerModal()}
function objectLabel(o){if(o.kind==='text')return (o.text||'Teks').slice(0,28);if(o.kind==='image')return 'Foto';if(o.kind==='shape')return 'Shape';if(o.kind==='emoji')return 'Stiker';return 'Objek'}
function layerThumb(o){if(o.kind==='image'&&o.src)return `<img src="${o.src}" alt="">`;if(o.kind==='text')return 'T';if(o.kind==='shape')return '◇';return esc(o.text||'✦')}
function openLayerModal(){
 const p=getBook()?.pages[currentPage];if(!p)return;
 const items=p.elements.slice().reverse();
 const rows=items.length?items.map((o,revIndex)=>{const actualIndex=p.elements.length-1-revIndex;return `<div class="layer-item ${o.id===selectedId?'selected':''}">
   <span class="layer-drag">☷</span><button class="layer-thumb" onclick="selectObject('${o.id}');openLayerModal()">${layerThumb(o)}</button>
   <button class="layer-name" onclick="selectObject('${o.id}');openLayerModal()"><b>${esc(objectLabel(o))}</b><small>${o.kind==='text'?'Teks':o.kind==='image'?'Foto':o.kind==='shape'?'Shape':'Stiker'} · layer ${actualIndex+1}</small></button>
   <button class="layer-icon-btn" title="Tampilkan/Sembunyikan" onclick="toggleObjectVisibility('${o.id}')">${o.visible===false?'◌':'◉'}</button>
   <button class="layer-icon-btn" title="Naik" onclick="selectObject('${o.id}',false);layerMove('up')">↑</button>
   <button class="layer-icon-btn" title="Turun" onclick="selectObject('${o.id}',false);layerMove('down')">↓</button>
 </div>`}).join(''):'<div class="layer-empty">Belum ada objek di halaman ini.<br><small>Tambahkan teks, foto, stiker, atau shape terlebih dahulu.</small></div>';
 const o=getObject(selectedId);
 openModal(`<div class="layer-modal"><div class="layer-head"><h3>Layer</h3><span class="layer-count">${p.elements.length} objek</span><button class="backbtn" onclick="closeModal()">×</button></div><div class="layer-toolbar"><button onclick="layerMove('top')">⇈ Ke paling depan</button><button onclick="layerMove('up')">↑ Naik</button><button onclick="layerMove('down')">↓ Turun</button><button onclick="layerMove('bottom')">⇊ Ke belakang</button></div><div class="layer-list">${rows}</div>${o?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px"><button class="mini-btn" style="padding:11px" onclick="duplicateObject();closeModal()">⧉ Duplikat</button><button class="mini-btn" style="padding:11px;color:#b84e68" onclick="deleteObject();closeModal()">🗑 Hapus</button></div>`:''}</div>`)
}
function addText(){const b=getBook();if(!b)return;commitHistory();const o=textObj(b.title||'Teks baru',12,28,76,16,28,THEMES[b.theme].text,true);o.font='Georgia';o.align='center';o.visible=true;o.opacity=1;b.pages[currentPage].elements.push(o);selectedId=o.id;b.updated=Date.now();persist();renderEditor();setTimeout(()=>openTextEditorSheet(),40)}
function addEmoji(){commitHistory();const o=emojiObj('💗');getBook().pages[currentPage].elements.push(o);selectedId=o.id;persist();renderEditor()}
function addShape(){commitHistory();const o={id:uid('o'),kind:'shape',x:15,y:25,w:70,h:25,fill:THEMES[getBook().theme].accent,radius:18,opacity:.9,rotate:0,locked:false,visible:true};getBook().pages[currentPage].elements.push(o);selectedId=o.id;persist();renderEditor()}
function addPhoto(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(!i.files[0])return;commitHistory();const o=imageObj(await readFile(i.files[0]),12,18,76,50);getBook().pages[currentPage].elements.push(o);selectedId=o.id;persist();renderEditor()};i.click()}
function addPage(){const b=getBook();commitHistory();const n=b.pages.filter(p=>p.type==='body').length+1,p=makePage('body','Halaman '+n,b.theme);b.pages.splice(Math.max(1,b.pages.length-1),0,p);currentPage=Math.max(1,b.pages.length-2);selectedId=null;persist();editor()}
function deletePage(){const b=getBook();if(b.pages[currentPage].type!=='body')return alert('Cover Depan dan Cover Belakang tidak dapat dihapus.');if(b.pages.filter(p=>p.type==='body').length<=1)return alert('Minimal satu halaman isi harus ada.');commitHistory();b.pages.splice(currentPage,1);currentPage=Math.max(0,currentPage-1);selectedId=null;persist();editor()}
function duplicatePage(){const b=getBook();commitHistory();const copy=JSON.parse(JSON.stringify(b.pages[currentPage]));copy.id=uid('p');copy.title='Salinan halaman';b.pages.splice(currentPage+1,0,copy);currentPage++;persist();editor()}
function goPage(i){currentPage=i;selectedId=null;editor()}
function jumpType(type){const b=getBook(),i=b.pages.findIndex(p=>p.type===type);if(i>=0)goPage(i)}
function pageManager(){openModal(`<h3>Kelola Halaman</h3><button class="primary full" onclick="addPage();closeModal()">＋ Tambah Halaman</button><button class="mini-btn" style="width:100%;margin-top:8px;padding:12px" onclick="duplicatePage();closeModal()">⧉ Duplikat Halaman</button><button class="mini-btn" style="width:100%;margin-top:8px;padding:12px" onclick="deletePage();closeModal()">⌫ Hapus Halaman</button>`)}
function backgroundScreen(){const b=getBook();const q=window.bgSearch||'';const list=BACKGROUNDS.filter(x=>x.name.toLowerCase().includes(q.toLowerCase()));openModal(`<h3>Background / Fond</h3><p class="muted">117 fond siap pakai. Tampilan halaman tetap memakai ukuran dan tata letak editor.</p><input class="asset-search" placeholder="Cari fond…" value="${esc(q)}" oninput="window.bgSearch=this.value;backgroundScreen()"><div class="asset-count">${list.length} dari ${BACKGROUNDS.length} fond</div><div class="asset-library">${list.map(x=>`<button class="asset-card" onclick="setPageBackgroundCSS('${x.id}');closeModal()"><div class="asset-preview" style="background:${x.css}"></div><b>${esc(x.name)}</b><small>Fond ${x.id.replace('bg','')}</small></button>`).join('')}</div><label class="label">Warna custom</label><input class="colorbox" style="width:100%" type="color" value="${b.pages[currentPage].bg.startsWith('#')?b.pages[currentPage].bg:'#ffffff'}" onchange="customBg(this.value)">`)}
function setPageBackgroundCSS(id){const x=BACKGROUNDS.find(v=>v.id===id);if(!x)return;commitHistory();getBook().pages[currentPage].bg=x.css;getBook().pages[currentPage].backgroundId=x.id;getBook().updated=Date.now();persist();renderEditor()}

function downloadReadable(id){const b=state.books.find(x=>x.id===id);if(!b)return;const bg=b.animation?.background||'sunset',tr=b.animation?.transition||'slide',spd=Math.max(.5,b.animation?.speed||1);const bgMap={sunset:'linear-gradient(160deg,#f2ad79,#d98983 46%,#263a5e)',paper:'linear-gradient(180deg,#f8f0e4,#dfcfbd)',cloud:'linear-gradient(180deg,#dcecff,#b7d1ea 52%,#8aa8c5)',night:'linear-gradient(180deg,#0d1530,#253a63 52%,#111827)'};const spec=bookSizeSpec(b.size||'a5');const pages=b.pages.map((p,i)=>`<section class="book-page ${i===0?'active':''}" data-page="${i}" style="background:${p.bg};aspect-ratio:${spec.ratio}"><div class="page-title">${esc(p.title)}</div>${p.elements.filter(o=>o.visible!==false).map(o=>{const st=`left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%;opacity:${o.opacity??1};transform:rotate(${o.rotate||0}deg);`;if(o.kind==='image')return `<img src="${o.src}" style="${st}object-fit:cover;">`;if(o.kind==='shape')return `<div style="${st}background:${o.fill||'#8b7cf6'};border-radius:${o.radius||18}px;"></div>`;return `<div style="${st}font-size:${o.size||24}px;color:${o.color||'#30293d'};font-weight:${o.bold?'800':'500'};font-style:${o.italic?'italic':'normal'};text-align:${o.align||'left'};">${esc(o.text||'')}</div>`}).join('')}</section>`).join('');const music=b.music?.src?`<audio id="music" src="${b.music.src}" loop></audio>`:'';const transitionCSS={slide:'transform .45s ease,opacity .45s ease',turn:'transform .55s ease,opacity .55s ease',fade:'opacity .45s ease',push:'transform .45s ease,opacity .45s ease'}[tr]||'all .45s ease';const html=`<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>${esc(b.title)}</title><style>*{box-sizing:border-box}body{margin:0;background:#171426;color:#fff;font-family:system-ui;min-height:100vh;display:flex;flex-direction:column;align-items:center}.bg{position:fixed;inset:0;background:${bgMap[ function libraryCard(b){const t=THEMES[b.theme];return `<div class="library-card"><div class="library-cover" style="background:${t.bg};color:${t.text}">${esc(b.title)}</div><div class="library-info"><b>${esc(b.title)}</b><small>${b.pages.length} halaman · ${t.name}${b.pinnedSample?' · 📌 Contoh':''}</small><div class="mini-actions"><button class="mini-btn" onclick="editBook('${b.id}')">✎ Edit</button><button class="mini-btn" onclick="reader('${b.id}')">▶ Baca</button><button class="mini-btn green" onclick="downloadProject('${b.id}')">💾 Simpan</button><button class="mini-btn" onclick="downloadReadable('${b.id}')">📕 Buku</button><button class="mini-btn green" onclick="printBook('${b.id}')">📄 PDF</button><button class="mini-btn" onclick="bookOptions('${b.id}')">⋮</button></div></div></div>`}
function bookOptions(id){const b=state.books.find(x=>x.id===id);openModal(`<h3>${esc(b.title)}</h3><button class="primary full" onclick="downloadProject('${id}');closeModal()">💾 Simpan Project</button><button class="mini-btn" style="width:100%;padding:12px;margin-top:8px" onclick="downloadReadable('${id}');closeModal()">📕 Simpan Buku HTML</button><button class="mini-btn" style="width:100%;padding:12px;margin-top:8px" onclick="renameBook('${id}');closeModal()">✎ Ganti Judul</button><button class="mini-btn" style="width:100%;padding:12px;margin-top:8px;color:#b53c5b" onclick="deleteBook('${id}');closeModal()">🗑 Hapus Buku</button>`)}
function renameBook(id){const b=state.books.find(x=>x.id===id);const n=prompt('Judul baru:',b.title);if(n?.trim()){b.title=n.trim();b.updated=Date.now();persist();library()}}
function deleteBook(id){const b=state.books.find(x=>x.id===id);if(b?.pinnedSample){alert('Contoh buku ini adalah koleksi bawaan dan tidak dapat dihapus. Kamu bisa menduplikasinya untuk diedit.');return}if(!confirm('Hapus buku ini dari perangkat?'))return;state.books=state.books.filter(b=>b.id!==id);persist();library()}
function importProject(){const i=document.createElement('input');i.type='file';i.accept='.json,.digitalbook.json,application/json';i.onchange=async()=>{try{const b=JSON.parse(await readFile(i.files[0]));if(!b||!Array.isArray(b.pages)||b.pages.length<1)throw Error();b.size=b.size||'a5';b.pages.forEach((p,pi)=>{if(!Array.isArray(p.elements))p.elements=[];p.id=p.id||uid('p');p.title=p.title||('Halaman '+(pi+1));p.type=p.type||'body';p.bg=p.bg||'#fff'});b.animation=b.animation||{background:'sunset',entrance:'rise',transition:'slide',speed:1,coverDuration:2.5};b.id=uid('book');b.updated=Date.now();b.title=(b.title||'Buku Import')+' (Import)';state.books.push(b);if(!persist()){state.books.pop();throw Error()}library()}catch{alert('File project tidak valid atau terlalu besar untuk penyimpanan perangkat.')}};i.click()}
function exportAllProjects(){try{const payload={app:'Digital Book Studio',version:1,exportedAt:new Date().toISOString(),books:state.books.map(b=>({...b,id:undefined}))};downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),'digital-book-studio-backup.json')}catch{alert('Backup tidak dapat dibuat.')}}
function oldShowSettings(){openModal(`<h3>Digital Book Studio</h3><p class="muted">Buku disimpan otomatis di penyimpanan browser perangkat ini.</p><button class="mini-btn" style="width:100%;padding:12px" onclick="importProject();closeModal()">📥 Import Project</button><button class="mini-btn" style="width:100%;padding:12px;margin-top:8px" onclick="exportAllProjects();closeModal()">🛡️ Backup Semua Buku</button><button class="mini-btn" style="width:100%;padding:12px;margin-top:8px" onclick="library();closeModal()">📚 Perpustakaan</button>`)}
function getProfile(){return JSON.parse(localStorage.getItem('dbs_profile')||'null')||{name:'Naufal Chan',email:'naufalchan@email.com',bio:'Pembuat cerita, pecinta visual, dan selalu mencari hal-hal baik di setiap proses.',instagram:'@naufalchan',tiktok:'@naufalchan',language:'Indonesia',theme:'system',notifications:true,bookNotifications:true,musicNotifications:true,emailNotifications:false,biometric:false,fontSize:50,accent:'#8b6cf6'};}

function profileScreen(){const p=getProfile();const books=state.books.length, pages=state.books.reduce((n,b)=>n+(b.pages?.length||0),0);app.innerHTML=`<div class="screen"><div class="page-head"><button class="backbtn" onclick="home()">‹</button><h2>Akun</h2><button class="backbtn" onclick="settingsScreen()">⚙</button></div><div class="profile-hero"><div class="profile-row">${profileAvatar()}<button class="avatar-edit" onclick="editProfileScreen()">✎</button><div><div class="profile-name">${esc(p.name)}</div><div class="profile-email">${esc(p.email)}</div><span class="premium-pill">♛ Pengguna Gratis</span></div></div><div class="profile-stats"><div class="stat-box"><b>${books}</b><small>Buku Dibuat</small></div><div class="stat-box"><b>${pages}</b><small>Halaman</small></div><div class="stat-box"><b>${state.customProperties?.length||0}</b><small>Properti</small></div></div></div><div class="settings-group"><div class="settings-title">Akun</div><div class="settings-card">${settingRow('♙','Edit Profil','Ubah data profil dan foto','editProfileScreen()')}${settingRow('◷','Riwayat Aktivitas','Lihat aktivitas aplikasi','activityScreen()')}${settingRow('♡','Favorit','Buku dan properti favorit','favoritesScreen()')}${settingRow('♧','Notifikasi','Atur pengingat dan informasi','notificationScreen()')}${settingRow('?','Bantuan & Dukungan','FAQ, panduan, hubungi kami','helpScreen()')}</div></div><div class="settings-group"><div class="settings-title">Aplikasi</div><div class="settings-card">${settingRow('☼','Tampilan','Mode terang / gelap','appearanceScreen()')}${settingRow('♧','Penyimpanan','Kelola ruang penyimpanan','storageScreen()')}${settingRow('▣','Data & Privasi','Kelola data dan keamanan','securityScreen()')}${settingRow('ⓘ','Tentang Aplikasi','Versi 1.0.0','aboutScreen()')}</div></div><div class="profile-note"><span class="big">♛</span>Ingin lebih banyak fitur?<br><b>Upgrade ke Premium</b> untuk membuka kemampuan tambahan.</div></div>${bottomNav('profile')}`}
function settingRow(icon,title,sub,action){return `<button class="setting-row" onclick="${action}"><span class="setting-icon">${icon}</span><span class="setting-copy"><b>${title}</b><small>${sub}</small></span><span class="chev">›</span></button>`}
function editProfileScreen(){const p=getProfile();app.innerHTML=`<div class="screen"><div class="page-head"><button class="backbtn" onclick="profileScreen()">‹</button><h2>Edit Profil</h2></div><div class="form-card"><div style="position:relative;width:88px;margin:auto"><div class="avatar" style="width:88px;height:88px"><img id="profileAvatarImg" src="${p.avatar||'./icon-192-full.png'}"></div><button class="avatar-edit" style="left:64px;top:64px" onclick="uploadAvatar()">📷</button></div><label class="label">Nama Lengkap</label><input id="pfName" class="input" value="${esc(p.name)}"><label class="label">Email</label><input id="pfEmail" class="input" type="email" value="${esc(p.email)}"><label class="label">Bio</label><textarea id="pfBio" class="input" rows="4" maxlength="150">${esc(p.bio)}</textarea><div style="text-align:right;color:#888;font-size:9px;margin-top:4px">Maks. 150 karakter</div><label class="label">Kontak Sosial (Opsional)</label><button class="choice-row" style="width:100%" onclick="editSocial('instagram')"><span class="setting-icon">◎</span><span class="grow"><b>Instagram</b><small>${esc(p.instagram||'Belum diatur')}</small></span><span class="chev">›</span></button><button class="choice-row" style="width:100%;margin-top:7px" onclick="editSocial('tiktok')"><span class="setting-icon">♪</span><span class="grow"><b>TikTok</b><small>${esc(p.tiktok||'Belum diatur')}</small></span><span class="chev">›</span></button><button class="primary full" onclick="saveProfileForm()">Simpan Perubahan</button></div></div>${bottomNav('profile')}`}
function saveProfileForm(){const p=getProfile();p.name=document.getElementById('pfName').value.trim()||'Pengguna';p.email=document.getElementById('pfEmail').value.trim()||'email@contoh.com';p.bio=document.getElementById('pfBio').value.trim();saveProfile(p);profileScreen()}
function uploadAvatar(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{if(!i.files[0])return;const r=new FileReader();r.onload=()=>{const p=getProfile();p.avatar=r.result;saveProfile(p);editProfileScreen()};r.readAsDataURL(i.files[0])};i.click()}
function editSocial(k){const p=getProfile(),v=prompt(k==='instagram'?'Username Instagram:':'Username TikTok:',p[k]||'');if(v!==null){p[k]=v.trim();saveProfile(p);editProfileScreen()}}
function settingsScreen(){const p=getProfile();app.innerHTML=`<div class="screen"><div class="page-head"><button class="backbtn" onclick="profileScreen()">‹</button><h2>Pengaturan</h2></div><div class="settings-group" style="margin-top:12px"><div class="settings-title">Akun</div><div class="settings-card">${settingRow('♙','Edit Profil','Ubah data profil dan foto','editProfileScreen()')}${settingRow('♧','Keamanan','Kelola kata sandi dan verifikasi','securityScreen()')}${settingRow('◎','Bahasa','Indonesia','languageScreen()')}</div></div><div class="settings-group"><div class="settings-title">Aplikasi</div><div class="settings-card">${settingRow('☼','Tampilan','Mode terang / gelap','appearanceScreen()')}${settingRow('♧','Notifikasi','Atur notifikasi aplikasi','notificationScreen()')}${settingRow('▣','Penyimpanan','Kelola ruang penyimpanan','storageScreen()')}${settingRow('▢','Data & Privasi','Kelola data kamu','privacyScreen()')}</div></div><div class="settings-group"><div class="settings-title">Lainnya</div><div class="settings-card">${settingRow('?','Bantuan & Dukungan','FAQ, panduan, hubungi kami','helpScreen()')}${settingRow('ⓘ','Tentang Aplikasi','Versi 1.0.0','aboutScreen()')}</div></div></div>${bottomNav('profile')}`}

function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function commitHistory(){const b=getBook();if(!b)return;undoStack.push(JSON.stringify(b));if(undoStack.length>30)undoStack.shift();redoStack=[]}
function undo(){const b=getBook();if(!b||!undoStack.length)return;redoStack.push(JSON.stringify(b));const prev=JSON.parse(undoStack.pop());const idx=state.books.findIndex(x=>x.id===b.id);state.books[idx]=prev;currentPage=Math.min(currentPage,prev.pages.length-1);selectedId=null;persist();editor()}
function redo(){const b=getBook();if(!b||!redoStack.length)return;undoStack.push(JSON.stringify(b));const next=JSON.parse(redoStack.pop());const idx=state.books.findIndex(x=>x.id===b.id);state.books[idx]=next;currentPage=Math.min(currentPage,next.pages.length-1);selectedId=null;persist();editor()}

const DBS_TEMPLATE_STYLES={
  classic:{bg:'linear-gradient(145deg,#fbf7ee,#eee4d3)',ink:'#2f2a26',accent:'#9a805f'},
  scrapbook:{bg:'linear-gradient(145deg,#fff8fb,#f7e6ee)',ink:'#503747',accent:'#e58aa8'},
  love:{bg:'linear-gradient(160deg,#fff1f5,#f7d7e3)',ink:'#5b3043',accent:'#d86b91'},
  birthday:{bg:'linear-gradient(145deg,#fffaf0,#ffe5ec)',ink:'#5a3343',accent:'#f09aaf'},
  travel:{bg:'linear-gradient(160deg,#edf8f2,#dceff4)',ink:'#294b49',accent:'#5e9e91'},
  photo:{bg:'linear-gradient(145deg,#20202a,#4c4a57)',ink:'#fff',accent:'#ffd36d'},
  vintage:{bg:'linear-gradient(145deg,#ead7b4,#f5e8ca)',ink:'#5a4631',accent:'#9a6f42'},
  minimalist:{bg:'linear-gradient(145deg,#ffffff,#f3f3f0)',ink:'#24242a',accent:'#8a8a92'}
};
function dbsShape(x,y,w,h,fill,radius=12,opacity=1){
  return {id:uid('o'),kind:'shape',x,y,w,h,fill,radius,opacity,rotate:0,locked:false,visible:true,shadow:false};
}
function dbsText(text,x,y,w,h,size,color,bold=false,align='center',font='Georgia'){
  const o=textObj(text,x,y,w,h,size,color,bold); o.align=align;o.font=font;return o;
}
function dbsEmoji(text,x,y,w,h,size=42){
  const o=emojiObj(text,x,y,w,h);o.size=size;return o;
}
function dbsImage(src,x,y,w,h){
  const o=imageObj(src,x,y,w,h);o.templatePlaceholder=true;o.shadow=true;o.border=0;return o;
}
function dbsTemplateObjects(index,title,theme){

  } else if(index===2){ // Love Story
    out.push(dbsImage('./assets/love.jpg',18,10,64,27));
    out.push(dbsEmoji('♡',35,7,30,18,58));
    out.push(dbsText('LOVE STORY',13,30,74,9,12,a,true));

  } else if(index===3){ // Birthday
    out.push(dbsImage('./assets/photo.jpg',18,13,64,25));
    out.push(dbsText('HAPPY BIRTHDAY',12,10,76,8,11,a,true,'center','Arial'));
    out.push(dbsEmoji('🎂',34,19,32,20,46));
    out.push(dbsText(title||'Birthday',9,42,82,17,30,ink,true));

    out.push(dbsText('✦  ✦  ✦  ✦  ✦',12,75,76,8,12,a,false,'center','Arial'));
  } else if(index===4){ // Travel Journal
    out.push(dbsShape(8,8,84,84,'#ffffff99',12,1));
    out.push(dbsImage('./assets/travel.jpg',18,12,64,24));
    out.push(dbsEmoji('🏔️',33,11,34,18,42));
    out.push(dbsText('TRAVEL JOURNAL',12,34,76,9,11,a,true,'center','Arial'));
    out.push(dbsText(title||'Travel Journal',10,44,80,17,28,ink,true));

    out.push(dbsText('EXPLORE • REMEMBER • REPEAT',10,76,80,7,8,ink,true,'center','Arial'));
  } else if(index===5){ // Photo Album
    out.push(dbsShape(10,9,80,54,'#ffffff18',3,1));
    out.push(dbsImage('./assets/photo.jpg',14,13,72,46));

    out.push(dbsShape(8,7,84,86,'#ffffff18',3,1));

    out.push(dbsShape(12,12,76,1,ink,0,.35));

function applyDBSTemplate(b,index){
  const data=dbsTemplateObjects(index,b.title,b.theme);
  const p=b.pages[0];
  p.bg=data.bg;
  p.elements=data.elements;
  b.templateIndex=index;
  b.templateName=TEMPLATES[index]?.[1]||'Template';
  b.templateEditable=true;
  // Keep the back cover editable too; it gets a simple companion layout.
  const back=b.pages?.find(x=>x.type==='back');
  if(back){
    back.bg=data.bg;
    const th=DBS_TEMPLATE_STYLES[['classic','scrapbook','love','birthday','travel','photo','vintage','minimalist'][index]]||DBS_TEMPLATE_STYLES.classic;
    back.elements=[dbsText('THE END',15,34,70,10,15,th.accent,true,'center','Arial'),dbsText(b.title||'Sampai jumpa di halaman berikutnya.',12,49,76,18,18,th.ink,false,'center')];
  }
  b.updated=Date.now();
}
function ensureDBSTemplate(b){
  if(!b)return;
  if(Number.isInteger(b.templateIndex) && b.pages?.[0]?.elements?.length) return;
  let idx=0;
  const byTheme={elegant:0,cute:1,romantic:2,nature:4,modern:5,vintage:6,dark:5,lavender:0};
  idx=byTheme[b.theme]??0;
  if(b.pinnedSample) idx=['nature','romantic','cute','modern','vintage'].indexOf(b.theme);
  if(idx<0)idx=0;
  if(b.pages?.[0]) applyDBSTemplate(b,idx);
}
function dbsCoverPreview(b,cls='library-cover'){
  ensureDBSTemplate(b);
  const p=b.pages?.find(x=>x.type==='cover')||b.pages?.[0];
  if(!p)return `<div class="${cls} real-cover"></div>`;
  const html=(p.elements||[]).filter(o=>o.visible!==false).map(o=>{
    const left=Number(o.x)||0,top=Number(o.y)||0,w=Number(o.w)||0,h=Number(o.h)||0;
    const base=`left:${left}%;top:${top}%;width:${w}%;height:${h}%;opacity:${o.opacity??1};transform:rotate(${o.rotate||0}deg);`;
    if(o.kind==='image') return `<div class="cover-preview-el" style="${base}"><img src="${o.src}" alt=""></div>`;
    if(o.kind==='shape') return `<div class="cover-preview-el" style="${base}background:${o.fill||'#fff'};border-radius:${Math.min(18,(o.radius||10)/4)}px;box-shadow:${o.shadow?'0 2px 5px #0003':'none'}"></div>`;
    if(o.kind==='emoji') return `<div class="cover-preview-el cover-preview-emoji" style="${base}font-size:${Math.max(7,Math.round((o.size||30)*.19))}px">${esc(o.text||'')}</div>`;
    const fs=Math.max(5,Math.round((o.size||20)*.19));
    return `<div class="cover-preview-el cover-preview-text" style="${base}font-size:${fs}px;color:${o.color||'#30293d'};font-family:'${o.font||'Georgia'}',Georgia,serif;font-weight:${o.bold?'800':'500'};font-style:${o.italic?'italic':'normal'};text-align:${o.align||'left'}">${esc(o.text||'')}</div>`;
  }).join('');
  return `<div class="${cls} real-cover" style="background:${p.bg};color:#30293d">${html}</div>`;
}
function dbsTemplateCard(t,i){
  const idx=i%TEMPLATES.length;
  const d=dbsTemplateObjects(idx,t[1],t[3]);
  const fake={title:t[1],theme:t[3],pages:[{type:'cover',bg:d.bg,elements:d.elements}]};
  return `<button class="template-card" onclick="createFromTemplate(${idx})"><div class="template-cover real-template">${dbsCoverPreview(fake,'tpl-mini-wrap')}</div><div class="template-name">${esc(t[1])}</div></button>`;
}
/* Rebuild template selection with actual editable designs. */
function templateCard(t,i){return dbsTemplateCard(t,i)}
function createFromTemplate(i){createScreen(TEMPLATES[i],i)}
function createScreen(preset=null,presetIndex=null){
  const theme=preset?.[3]||'lavender',title=preset?.[1]||'My Little World';
  const selected=Number.isInteger(presetIndex)?presetIndex:'';
  const themeKeys=['lavender','vintage','romantic','nature','dark'];
  const themeImgs={lavender:'create_lavender',vintage:'create_vintage',romantic:'create_romantic',nature:'create_nature',dark:'create_dark'};
  const templateImgs=['classic','create_scrapbook','love','photo','travel','photo','vintage','new2'];
  app.innerHTML=`<div class="screen create-v2"><div class="create-head"><button class="backbtn" onclick="home()">‹</button><div class="create-title-wrap"><h2>Buat Buku Baru <span class="spark">✦</span></h2><div class="create-sub">Pilih template sebagai titik awal, lalu ubah semua elemennya di editor.</div></div></div><div class="create-content">
  <div class="template-editor-note">Template hanya <b>titik awal desain</b>. Setelah buku dibuat, judul, teks, foto, warna, posisi, ukuran, dekorasi, dan layer dapat kamu ubah satu per satu.</div>
  <div class="create-card"><div class="create-label"><span class="label-ico">▱</span>Judul Buku</div><input id="bookTitle" class="title-field" value="${esc(title)}"></div>
  <div class="create-card"><div class="create-label"><span class="label-ico">✦</span>Pilih Gaya / Auto Theme <button class="section-link" style="margin-left:auto;font-size:10px" onclick="themeScreen()">Lihat Semua ›</button></div><div class="theme-scroll">${themeKeys.map(k=>{const t=THEMES[k];return `<button class="theme-choice ${k===theme?'active':''}" onclick="selectTheme(this,'${k}')"><img src="./assets/${themeImgs[k]}.jpg" alt="${t.name}"><b>${t.name}</b></button>`}).join('')}</div></div>
  <input id="bookTheme" type="hidden" value="${theme}"><input id="bookTemplate" type="hidden" value="${selected}">
  <div class="create-card"><div class="create-label"><span class="label-ico">▣</span>Ukuran Buku</div><div class="size-row"><button class="size-choice active" data-size="a5"><b>A5</b><small>Portrait</small></button><button class="size-choice" data-size="a4"><b>A4</b><small>Portrait</small></button><button class="size-choice" data-size="square"><b>Square</b><small>1:1</small></button><button class="size-choice" data-size="916"><b>9:16</b><small>Portrait</small></button></div></div>
  <div class="create-card"><div class="create-label"><span class="label-ico">▤</span>Template <button class="section-link" style="margin-left:auto;font-size:10px" onclick="templatesScreen()">Lihat Semua ›</button></div><div class="template-scroll">${TEMPLATES.map((t,i)=>{const d=dbsTemplateObjects(i,t[1],t[3]);return `<button class="template-choice ${i===selected?'selected-template':''}" onclick="createFromTemplate(${i})"><div class="template-choice-cover">${dbsCoverPreview({title:t[1],theme:t[3],pages:[{type:'cover',bg:d.bg,elements:d.elements}]},'library-cover')}</div><span>${esc(t[1])}</span></button>`}).join('')}</div><div class="template-editor-note">Template ini bukan gambar mati. Saat buku dibuat, elemen cover menjadi objek yang bisa kamu pilih, pindahkan, ubah teks, ganti foto, atur warna, ukuran, dan layer.</div></div>
  <div class="create-card"><div class="create-label"><span class="label-ico">▧</span>Upload Foto <small style="font-weight:500;color:#888">(Opsional)</small></div><label class="upload-box" for="bookPhotos"><span class="upload-icon">⌑</span><span><b>Tambah foto dari galeri</b><small>Bisa sampai banyak foto</small></span><span style="margin-left:auto;color:#765ddd;font-size:22px">›</span></label><input id="bookPhotos" type="file" accept="image/*" multiple></div>
  <button class="primary full" onclick="createBookNow()">Buat Buku &nbsp;→</button></div></div>`;
  document.querySelectorAll('.size-choice').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.size-choice').forEach(x=>x.classList.remove('active'));btn.classList.add('active')});
}
async function createBookNow(){
  const title=document.getElementById('bookTitle').value.trim()||'Buku Baru',theme=document.getElementById('bookTheme').value;
  const ti=document.getElementById('bookTemplate').value;
  const size=document.querySelector('.size-choice.active')?.dataset.size||'a5';
  const b=makeBook(title,theme); b.size=size;
  if(ti!=='' && Number.isInteger(+ti)) applyDBSTemplate(b,+ti);
  else applyDBSTemplate(b,0);
  const files=[...document.getElementById('bookPhotos').files];
  if(files.length){
    b.pages.splice(1,0,...await Promise.all(files.map(async(f,i)=>{const p=makePage('body','Halaman '+(i+1),theme);p.elements.push(imageObj(await readFile(f),12,12,76,58));return p})));
    b.pages=b.pages.map((p,i)=>{if(p.type==='body'&&!p.elements.length)p.title='Halaman '+(i);return p});
  }
  state.books.push(b);currentId=b.id;currentPage=0;selectedId=null;persist();editor();
}
/* Use the real rendered cover in the library instead of a blank paper. */
function libraryCard(b){
  ensureDBSTemplate(b);
  const t=THEMES[b.theme]||THEMES.lavender;
  const label=b.pinnedSample?' · 📌 Contoh':'';
  return `<div class="library-card">${dbsCoverPreview(b)}<div class="library-info"><b>${esc(b.title)}</b><small>${b.pages.length} halaman · ${esc(b.templateName||t.name||'Tema')} · ${esc((bookSizeSpec(b.size||'a5').label))}${label}</small><div class="mini-actions"><button class="mini-btn" onclick="editBook('${b.id}')">✎ Edit</button><button class="mini-btn" onclick="reader('${b.id}')">▶ Baca</button><button class="mini-btn green" onclick="downloadProject('${b.id}')">💾 Simpan</button><button class="mini-btn" onclick="downloadReadable('${b.id}')">📕 Buku</button><button class="mini-btn" onclick="bookOptions('${b.id}')">⋮</button></div></div></div>`;
}
function library(){
  stopAudio();
  const q=(window.librarySearch||'').toLowerCase().trim();
  const sort=window.librarySort||'updated';
  const selectedUpdated=sort==='updated'?'selected':'';
  const selectedTitle=sort==='title'?'selected':'';
  let books=state.books.filter(b=>!q||b.title.toLowerCase().includes(q)||(b.templateName||'').toLowerCase().includes(q));
  books.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title):((b.updated||b.created||0)-(a.updated||a.created||0)));
  app.innerHTML=`<div class="screen"><div class="page-head"><button class="backbtn" onclick="home()">‹</button><h2>Perpustakaan</h2><button class="mini-btn" onclick="importProject()">📥 Import</button></div><div class="page-content"><div class="section-head" style="padding:0"><div><b>${state.books.length} Buku</b><div class="muted">Tersimpan otomatis di perangkat</div></div><button class="primary" style="padding:11px 14px;font-size:12px" onclick="createScreen()">＋ Baru</button></div><div style="display:flex;gap:8px;margin:12px 0"><input class="input" style="flex:1;padding:11px 13px" placeholder="Cari buku atau template…" value="${esc(window.librarySearch||'')}" oninput="window.librarySearch=this.value;library()"><select class="input" style="width:130px;padding:11px 8px" onchange="window.librarySort=this.value;library()"><option value="updated" ${selectedUpdated}>Terbaru</option><option value="title" ${selectedTitle}>Judul A–Z</option></select></div><div class="library-grid">${books.length?books.map(libraryCard).join(''):'<div class="empty">Tidak ada buku yang cocok.<br><button class="mini-btn" style="margin-top:10px" onclick="window.librarySearch=\"\";library()">Tampilkan semua</button></div>'}</div></div></div>${bottomNav('library')}`;
}
